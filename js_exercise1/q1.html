<!DOCTYPE html>
<html lang="en">
<head>
    <title>JS_Assignment</title>
    <link rel="stylesheet" href="assignment.css">
</head>
<body>

<form class="Form" onsubmit="calculateSI(event)">
    <h2>Simple Interest Calculator</h2>
    <label>Principal Amount:
    <input type="number" class="principal" required>
    </label>

    <label>
        Rate of Interest:
        <input type="number" class="rate" required>
    </label>

    <label>
        Time In Years:
        <input type="number" class="time" required>
    </label>

    <button type="submit">Calculate</button>
</form>

<script src="q1.js"></script>
</body>
</html>
