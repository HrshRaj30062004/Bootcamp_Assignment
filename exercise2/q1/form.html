<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bug Report</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>

<header class="topbar">
    <span class="logo">TO THE NEW</span>
    <nav>
        <a href="#">Home</a>
        <a href="#">Quick Help</a>
    </nav>
</header>

<section class="box">
    <h2>Bug Report</h2>

    <form>
        <label>Title:* </label>
        <input type="text" class="form-field">

        <label>Description:* </label>
        <textarea class="form-field"></textarea>

        <label>Operating system:</label>
        <select class="form-field">
            <option>Windows XP</option>
            <option>Windows 10</option>
            <option>Linux</option>
            <option>Mac OS</option>
        </select>
        <label>Product:* </label>
        <select class="form-field">
            <option>Formoid</option>
            <option>Formoid Pro</option>
        </select>

        <label>Version:* </label>
        <input type="text">

        <label>License:</label>
        <div class="radio-group">
            <label><input type="radio" name="license"> Free</label>
            <label><input type="radio" name="license"> Business</label>
        </div>

        <label>Severity:</label>
        <select class="form-field">
            <option>Critical</option>
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
        </select>

        <label>Attachments:</label>
        <input type="file">
        
    </form>
    <div class="form-footer">
            <button type="submit" class="buttn">Send</button>
        </div>
</section>

</body>
</html>
