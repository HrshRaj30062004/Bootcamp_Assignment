<!DOCTYPE html>
<html lang="en">
<head>
    <title>JS_Assignment</title>
    <link rel="stylesheet" href="assignment.css">
</head>
<body>

<div class="container">
    <h2>Temperature Converted</h2>
    <button onclick="temperature.read()" class="enter-button">Enter Temperature</button>

    <div class="buttons">
        <button onclick="temperature.toFahrenheit()">Fahrenheit</button>
        <button onclick="temperature.toKelvin()">Kelvin</button>
        <button onclick="temperature.display()">Display Result</button>
    </div>

    <div class="output-box">
        <h3>Output</h3>
        <p class="output"></p>
    </div>
</div>

<script src="q2.js"></script>
</body>
</html>
